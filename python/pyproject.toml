[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manastorm"
version = "1.0.0"
description = "MANASTORM — Tactical TCG Roguelike in Native Python"
authors = [{ name = "Gunner" }]
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5.0",
    "moderngl>=5.10.0",
    "numpy>=1.26.0",
]

[project.scripts]
manastorm = "manastorm.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["manastorm*"]

[tool.setuptools.package-data]
manastorm = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
