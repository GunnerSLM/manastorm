[package]
name = "manastorm-desktop"
version = "1.0.0"
description = "MANASTORM — MTG × Balatro Tactical Deckbuilder Desktop App"
authors = ["MANASTORM Team"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "manastorm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
